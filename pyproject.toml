[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rgflow"
version = "0.1.0"
description = "Renormalization-group accelerated lattice field sampling"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
flow = ["torch>=2.2"]
presentation = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5"]

[project.scripts]
rgflow = "rgflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
